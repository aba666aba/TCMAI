<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>历史记录 - 中医药智能问答系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- 导航栏 -->
        <nav class="navbar">
            <div class="logo">
                <span class="tcm-icon">🌿</span>
                <h1>中医药智能问答系统</h1>
            </div>
            <ul class="nav-links">
                <li><a href="/">首页</a></li>
                <li><a href="/history" class="active">历史记录</a></li>
                <li><a href="/about">关于</a></li>
            </ul>
        </nav>

        <!-- 主内容区 -->
        <main class="main-content">
            <section class="history-section">
                <h2>查询历史</h2>
                
                <!-- 筛选工具栏 -->
                <div class="filter-toolbar">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="搜索历史记录...">
                        <button id="searchBtn">搜索</button>
                    </div>
                    <div class="filter-options">
                        <select id="dateFilter">
                            <option value="all">全部时间</option>
                            <option value="today">今天</option>
                            <option value="week">本周</option>
                            <option value="month">本月</option>
                        </select>
                        <button id="exportBtn" class="export-btn">导出全部</button>
                        <button id="clearBtn" class="clear-btn">清空历史</button>
                    </div>
                </div>

                <!-- 历史记录列表 -->
                <div class="history-list" id="historyList">
                    <!-- 历史记录项模板 -->
                    <div class="history-item">
                        <div class="history-header">
                            <span class="history-date">2026-03-18 10:30:25</span>
                            <span class="history-type">症状咨询</span>
                        </div>
                        <div class="history-content">
                            <div class="history-query">
                                <strong>问：</strong>
                                <span>最近感觉乏力、食欲不振，有什么调理建议？</span>
                            </div>
                            <div class="history-answer">
                                <strong>答：</strong>
                                <span>根据您的症状描述，可能属于脾胃虚弱的表现...</span>
                            </div>
                        </div>
                        <div class="history-actions">
                            <button class="view-btn">查看详情</button>
                            <button class="delete-btn">删除</button>
                        </div>
                    </div>
                </div>

                <!-- 空状态提示 -->
                <div class="empty-state" id="emptyState" style="display: none;">
                    <div class="empty-icon">📋</div>
                    <p>暂无历史记录</p>
                    <a href="/" class="go-home-btn">去提问</a>
                </div>
            </section>
        </main>

        <!-- 页脚 -->
        <footer class="footer">
            <p>© 2026 中医药智能问答系统 | 本系统仅提供中医药知识科普，不构成医疗建议</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/history.js') }}"></script>
</body>
</html>
